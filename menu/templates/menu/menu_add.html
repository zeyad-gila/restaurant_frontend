{% extends "base.html" %}
{% load static %}

{% block title %}Add Menu Item{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'menu/css/menu_add.css' %}">
{% endblock %}

{% block content %}
<div class="menu-form-container">
  <h2>Add Menu Item</h2>

  <form id="menu-item-form">
    <label for="name">Name:</label>
    <input type="text" id="name" required>

    <label for="description">Description:</label>
    <textarea id="description" required></textarea>

    <label for="price">Price:</label>
    <input type="number" id="price" step="0.01" required>

    <label for="category">Category:</label>
    <select id="category" required></select>
    
    <label for="image">Item Image:</label>
    <input type="file" id="image" accept="image/*">

    <div id="image-preview" style="margin-top: 10px;"></div>
    <!-- 🧾 Discount Section -->
    <h3>Optional Discount</h3>

    <label for="discount-percent">Discount Percent:</label>
    <input type="number" id="discount-percent" placeholder="e.g. 10" min="1" max="100">

    <label for="discount-duration">Duration (days):</label>
    <input type="number" id="discount-duration" placeholder="e.g. 7" min="1">

    <label for="discount-start">Start Date (optional):</label>
    <input type="datetime-local" id="discount-start">

    <label for="discount-repeat">Repeat Weekly on (optional):</label>
    <select id="discount-repeat">
      <option value="">-- None --</option>
      <option value="0">Saturday</option>
      <option value="1">Sunday</option>
      <option value="2">Monday</option>
      <option value="3">Tuesday</option>
      <option value="4">Wednesday</option>
      <option value="5">Thursday</option>
      <option value="6">Friday</option>
    </select>

    <button type="submit">Add Item</button>

  </form>

  <p id="response"></p>
</div>

<script src="{% static 'menu/js/menu_add.js' %}"></script>
{% endblock %}

{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block title %}{% trans "Add Menu Item" %}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'menu/css/menu_add.css' %}">
{% endblock %}

{% block content %}
<div class="menu-form-container">
  <h2>{% trans "Add Menu Item" %}</h2>

  <form id="menu-item-form">
    <label for="name">{% trans "Name" %}:</label>
    <input type="text" id="name" required>

    <label for="description">{% trans "Description" %}:</label>
    <textarea id="description" required></textarea>

    <label for="price">{% trans "Price" %}:</label>
    <input type="number" id="price" step="0.01" required>

    <label for="category">{% trans "Category" %}:</label>
    <select id="category" required></select>
    
    <label for="image">{% trans "Item Image" %}:</label>
    <input type="file" id="image" accept="image/*">

    <div id="image-preview" style="margin-top: 10px;"></div>

    <!-- 🧾 Discount Section -->
    <h3>{% trans "Optional Discount" %}</h3>

    <label for="discount-percent">{% trans "Discount Percent" %}:</label>
    <input type="number" id="discount-percent" placeholder="{% trans 'e.g. 10' %}" min="1" max="100">

    <label for="discount-duration">{% trans "Duration (days)" %}:</label>
    <input type="number" id="discount-duration" placeholder="{% trans 'e.g. 7' %}" min="1">

    <label for="discount-start">{% trans "Start Date (optional)" %}:</label>
    <input type="datetime-local" id="discount-start">

    <label for="discount-repeat">{% trans "Repeat Weekly on (optional)" %}:</label>
    <select id="discount-repeat">
      <option value="">{% trans "-- None --" %}</option>
      <option value="0">{% trans "Saturday" %}</option>
      <option value="1">{% trans "Sunday" %}</option>
      <option value="2">{% trans "Monday" %}</option>
      <option value="3">{% trans "Tuesday" %}</option>
      <option value="4">{% trans "Wednesday" %}</option>
      <option value="5">{% trans "Thursday" %}</option>
      <option value="6">{% trans "Friday" %}</option>
    </select>

    <button type="submit">{% trans "Add Item" %}</button>
  </form>

  <p id="response"></p>
</div>

<script src="{% static 'menu/js/menu_add.js' %}"></script>
{% endblock %}

{% extends "base.html" %}
{% load static %}
{% block show_navbar %}{% endblock %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'users/css/verify_style.css' %}">


<form id="verify-form">
  <h2>Verify Your Account</h2>
  <p>Please enter the OTP sent to your email to activate your account.</p>
  <input type="text" id="otp" placeholder="Enter OTP" maxlength="6" required><br>
  <button type="submit">Verify</button>
</form>

<p id="response"></p>

<script src="{% static 'users/js/verify_otp.js' %}"></script>
{% endblock %}

{% load static i18n %}

<nav class="sidebar" dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}">
  <div class="logo">R.</div>

  <ul class="nav-links">
    <li class="nav-item active">
      <a href="/menu/list/" title="{% trans 'Home' %}">
       <i class="fas fa-utensils"></i>
      </a>  
    </li>
    <li class="nav-item">
      <a href="/menu/categories/" title="{% trans 'Categories' %}">
        <i class="fa-solid fa-bars"></i>
      </a>
    </li>
    <li class="nav-item">
      <a href="/carts/cart/" title="{% trans 'Cart' %}">
        <i class="fas fa-shopping-cart"></i>

      </a>
    </li>
    <li class="nav-item">
      <a href="/menu/add/" title="{% trans 'Contact' %}">
       <i class="fa fa-plus" aria-hidden="true"></i>
      </a>
    </li>

    <li class="nav-item logout">
      <a href="#" id="logout-btn" title="{% trans 'Logout' %}">
        <i class="fas fa-sign-out-alt"></i>
      </a>
    </li>
  </ul>

  <!-- ✅ Language Switcher -->
  <form action="{% url 'set_language' %}" method="post" class="mt-3 text-center">
    {% csrf_token %}
    <select name="language" onchange="this.form.submit()" class="form-select form-select-sm w-75 mx-auto">
      {% get_current_language as LANGUAGE_CODE %}
      {% get_available_languages as LANGUAGES %}
      {% for lang in LANGUAGES %}
        <option value="{{ lang.0 }}" {% if lang.0 == LANGUAGE_CODE %}selected{% endif %}>
          {{ lang.1 }}
        </option>
      {% endfor %}
    </select>
  </form>
</nav>

<!-- Font Awesome -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
/>

  <!-- Inline JS -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
    const logoutBtn = document.getElementById("logout-btn");

    logoutBtn.addEventListener("click", async function (e) {
      e.preventDefault();

      const refresh = localStorage.getItem("refresh");

      try {
        await fetch("http://127.0.0.1:8000/logout/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + localStorage.getItem("access")
          },
          body: JSON.stringify({ refresh })
        });
      } catch (err) {
        console.error("Logout error:", err);
      }

      // Always remove tokens locally
      localStorage.removeItem("access");
      localStorage.removeItem("refresh");
      localStorage.removeItem("userEmail");

      // Redirect to login
      window.location.href = "/login/";
    });
  });
  document.addEventListener("DOMContentLoaded", function () {
    const navItems = document.querySelectorAll(".nav-item a");
    const currentPath = window.location.pathname;

    navItems.forEach((link) => {
      link.parentElement.classList.remove("active");

      if (link.getAttribute("href") === currentPath) {
        link.parentElement.classList.add("active");
      }
    });
  });
</script>
